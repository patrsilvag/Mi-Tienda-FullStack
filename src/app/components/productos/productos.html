<div class="container mt-5">
  <h2 class="text-center mb-4">Catálogo de Productos</h2>
  <div class="row">
    <!-- Iteramos sobre el arreglo de productos -->
    <div class="col-12 col-md-6 col-lg-4 mb-4" *ngFor="let producto of productos">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body d-flex flex-column text-center">
          <h5 class="card-title fw-bold text-primary">{{ producto.nombre }}</h5>
          <p class="card-text flex-grow-1 text-muted">{{ producto.descripcion }}</p>
          <div class="mt-3 mb-3">
            <h4 class="text-success fw-bold">${{ producto.precio | number }}</h4>
            <span class="badge bg-secondary">Stock: {{ producto.stock }}</span>
          </div>
          <!-- Botón de compra conectado a tu TS -->
          <button class="btn btn-primary w-100 fw-bold mt-auto" (click)="comprarProducto(producto)">
            <i class="bi bi-cart-plus me-2"></i>Comprar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
