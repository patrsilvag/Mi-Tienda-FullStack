<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-11 col-md-8 col-lg-4">
    <div class="card shadow border-0">
      <div class="card-body p-4 p-md-5">
        <h3 class="text-center fw-bold mb-3">Recuperar Clave</h3>
        <p class="text-muted text-center small mb-4">Ingresa tu correo y te enviaremos las instrucciones.</p>

        @if (mensajeEnviado) {
          <div class="alert alert-success text-center shadow-sm">
            ¡Listo! Revisa tu bandeja de entrada para restablecer tu contraseña.
            <div class="mt-3">
              <a routerLink="/login" class="btn btn-outline-success btn-sm w-100">Volver al Login</a>
            </div>
          </div>
        } @else {
          <form [formGroup]="recuperarForm" (ngSubmit)="onRecuperar()">
            <div class="mb-3">
              <label class="form-label">Correo Electrónico</label>
              
              <input type="email" formControlName="email" class="form-control"
                     [class.is-invalid]="recuperarForm.get('email')?.invalid && recuperarForm.get('email')?.touched"
                     placeholder="nombre@ejemplo.com">
              
              <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm mt-2" [disabled]="recuperarForm.invalid">
              Enviar Instrucciones
            </button>

            <div class="text-center mt-4">
              <a routerLink="/login" class="small text-decoration-none fw-bold">Regresar al Login</a>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</div>
