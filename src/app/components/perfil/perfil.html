<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-11 col-md-8 col-lg-5">
    <div class="card shadow-lg border-0 overflow-hidden">
      
      <div class="bg-primary text-white text-center py-4">
        <div class="mb-3">
          <div class="d-inline-flex justify-content-center align-items-center bg-white text-primary rounded-circle shadow-sm" 
               style="width: 80px; height: 80px; font-size: 2.5rem; font-weight: bold;">
            {{ usuario.nombreUsuario.charAt(0) }}
          </div>
        </div>
        <h3 class="fw-bold mb-0">{{ usuario.nombreUsuario }}</h3>
        <p class="mb-0 opacity-75">{{ usuario.rol }}</p>
      </div>

      <div class="card-body p-4 p-md-5">
        <h5 class="fw-bold border-bottom pb-2 mb-4 text-secondary">Información Personal</h5>
        
        <form [formGroup]="perfilForm" (ngSubmit)="onActualizar()">
          
          <div class="mb-3">
            <label class="text-muted small fw-bold text-uppercase">Nombre de Usuario</label>
            @if (!editando) {
              <p class="fs-5 mb-0">{{ usuario.nombreUsuario }}</p>
            } @else {
              <input type="text" formControlName="nombreUsuario" class="form-control">
            }
          </div>

          <div class="mb-3">
            <label class="text-muted small fw-bold text-uppercase">Correo Electrónico</label>
            @if (!editando) {
              <p class="fs-5 mb-0">{{ usuario.email }}</p>
            } @else {
              <input type="email" formControlName="email" class="form-control">
            }
          </div>

          @if (editando) {
            <div class="mb-4">
              <label class="text-muted small fw-bold text-uppercase">Nueva Contraseña</label>
              <input type="password" formControlName="password" class="form-control" placeholder="Mínimo 8 caracteres">
            </div>
          }

          <div class="d-grid gap-2 mt-4">
            @if (!editando) {
              <button type="button" (click)="toggleEdicion()" class="btn btn-outline-primary py-2 shadow-sm">
                Editar Perfil
              </button>
              <button type="button" class="btn btn-danger py-2 shadow-sm" (click)="cerrarSesion()">
                Cerrar Sesión
              </button>
            } @else {
              <button type="submit" [disabled]="perfilForm.invalid" class="btn btn-success py-2 shadow-sm">
                Guardar Cambios
              </button>
              <button type="button" (click)="toggleEdicion()" class="btn btn-link text-muted">
                Cancelar
              </button>
            }
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
